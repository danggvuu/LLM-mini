version: '3.8'

services:
  notebooklm:
    build: .
    container_name: notebooklm_mini
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
    environment:
      - HF_DEVICE=cpu
      - DEFAULT_PROVIDER=groq
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

