version: '3.8'

services:
  notebooklm:
    build: .
    container_name: notebooklm_mini
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - RAG_HF_DEVICE=cpu
      - RAG_LLM_PROVIDER=${RAG_LLM_PROVIDER:-hf_local}
      - RAG_ALLOW_MODEL_DOWNLOAD=${RAG_ALLOW_MODEL_DOWNLOAD:-false}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
